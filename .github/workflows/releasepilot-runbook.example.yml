name: Create production release runbook

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: Production release number / Jira Fix Version (for example 26.09.18)
        required: true
        type: string
      baseline_ref:
        description: Currently deployed production branch, tag, or commit used for comparison
        required: false
        default: prd
        type: string
      release_title:
        description: Optional human-friendly release title
        required: false
        type: string
      additional_information:
        description: Optional release notes, validation details, approvals, or known risks
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-or-update-runbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install YAML reader
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Build redacted production release evidence
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          # The selected "Use workflow from" branch is checked out as GITHUB_SHA.
          # Only changed production values files are inspected. Secret values are
          # never written to the evidence or the generated runbook.
          mkdir -p releasepilot-changes
          git diff --name-only "$BASELINE_REF" "$GITHUB_SHA" -- 'app_manifest/*/prd/values_prd.yaml' > changed-values-files.txt
          test -s changed-values-files.txt || { echo "No component production values files changed."; exit 1; }
          while read -r values_file; do
            component=$(echo "$values_file" | cut -d/ -f2)
            safe_component=$(echo "$component" | tr '/ ' '--')
            git show "$BASELINE_REF:$values_file" > "releasepilot-changes/${safe_component}-current.yaml"
            python releasepilot/scripts/compare_prod_values.py \
              --current "releasepilot-changes/${safe_component}-current.yaml" \
              --candidate "$values_file" \
              --component "$component" \
              --release-number "$RELEASE_NUMBER" \
              --environment production \
              --repository "${{ github.repository }}" \
              --git-ref "$GITHUB_SHA" \
              --helm-path "$values_file" \
              --output "releasepilot-changes/${safe_component}.json"
          done < changed-values-files.txt
          jq -s \
            --arg release "$RELEASE_NUMBER" \
            --arg repository "${{ github.repository }}" \
            --arg ref "$GITHUB_SHA" \
            '{release_number:$release,environment:"production",repository:$repository,git_ref:$ref,helm_paths:map(.helm_paths[])|unique,jira_issues:[],helm_changes:map(.helm_changes[]) }' \
            releasepilot-changes/*.json > release-evidence.json

      - name: Create or update production runbook
        env:
          RELEASE_TITLE: ${{ inputs.release_title }}
          ADDITIONAL_INFORMATION: ${{ inputs.additional_information }}
        run: |
          python releasepilot/scripts/generate_runbook.py \
            --manifest release-evidence.json \
            --output-directory runbooks \
            --title "$RELEASE_TITLE" \
            --additional-information "$ADDITIONAL_INFORMATION"

      - name: Commit runbook update
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          git config user.name "releasepilot[bot]"
          git config user.email "releasepilot[bot]@users.noreply.github.com"
          git add runbooks
          git diff --cached --quiet && { echo "Runbook is already current."; exit 0; }
          git commit -m "docs: update ${RELEASE_NUMBER} production runbook"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Retain generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: releasepilot-${{ inputs.release_number }}
          path: |
            release-evidence.json
            runbooks/*-RUNBOOK.md
